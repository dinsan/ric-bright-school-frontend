# Lumina for development: clone, then
#
#   docker compose up
#
# and open http://localhost:3000 (emails the app sends: http://localhost:8025). Nothing to configure:
# the database is created, migrated and filled with sample courses and demo accounts, and the app runs
# `next dev` on your checkout, so saving a file reloads the page. Demo sign-ins are printed in the log.
#
# Everyday commands (or see `make help`):
#   docker compose up -d                  start in the background (docker compose logs -f app to follow)
#   docker compose exec app npm test      run the tests (they use their own database)
#   docker compose exec app sh            a shell in the app container (npm, npx prisma…)
#   docker compose down                   stop (data is kept)      docker compose down -v   …and wipe it
#
# Optional settings go in a .env file next to this one (see .env.example): other ports if these are
# taken, WATCH_POLL_INTERVAL_MS if hot reload misses changes (Windows), social sign-in keys.
# For a production-like run (built image, no hot reload): compose.prod.yaml.
name: lumina

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina
      POSTGRES_DB: lumina
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only on this machine: for database tools, or `npm run dev` outside Docker.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Catches every email the app sends (sign-up links, password resets) and shows them in a web inbox.
  mail:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
      # SMTP, for `npm run dev` outside Docker (SMTP_URL=smtp://localhost:1025).
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  app:
    build:
      context: .
      target: dev
    image: lumina-dev
    init: true
    environment:
      DATABASE_URL: postgres://lumina:lumina@db:5432/lumina
      # `npm test` creates and migrates this one itself.
      TEST_DATABASE_URL: postgres://lumina:lumina@db:5432/lumina_test
      SMTP_URL: smtp://mail:1025
      MAIL_FROM: "Lumina <no-reply@lumina.local>"
      APP_URL: http://localhost:${APP_PORT:-3000}
      # AUTH_SECRET is not needed in development (a development secret is used).
      SEED_ON_START: ${SEED_ON_START:-true}
      # Hot reload relies on file-change events; if they don't reach the container (some Windows and
      # macOS setups), poll instead: WATCH_POLL_INTERVAL_MS=1000 in .env (uses more CPU).
      WATCH_POLL_INTERVAL_MS: ${WATCH_POLL_INTERVAL_MS:-}
      # Shown in the startup message.
      APP_PORT: ${APP_PORT:-3000}
      MAIL_UI_PORT: ${MAIL_UI_PORT:-8025}
      # Social sign-in (optional): a provider's button appears once its keys are set in .env.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Your checkout, live: edits are picked up by the dev server.
      - .:/app
      # Installed inside Linux, kept apart from any node_modules or .next on your machine.
      - node_modules:/app/node_modules
      - next:/app/.next
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # The first start installs nothing but compiles on first request; give it time.
      start_period: 3m

volumes:
  pgdata:
  node_modules:
  next:
