<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Lumina home page mockup</title>
  <desc id="desc">A grade picker landing page with a hero section and grade tiles</desc>
  <rect width="1200" height="700" fill="#f5f2ee"/>
  <rect x="0" y="0" width="1200" height="70" fill="#f1efe7" stroke="#2d2d2d" stroke-width="2"/>
  <rect x="30" y="24" width="26" height="26" rx="7" fill="#1d4f92"/>
  <rect x="37" y="31" width="12" height="12" rx="3" fill="#f4d638"/>
  <text x="84" y="46" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1e1e1e">Lumina</text>
  <text x="870" y="46" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e">Courses</text>
  <circle cx="950" cy="35" r="10" fill="#f5f2ee" stroke="#1e1e1e" stroke-width="2"/>
  <path d="M950 29v12M944 35h12" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/>
  <rect x="1000" y="20" width="120" height="40" rx="10" fill="#0d0d0d"/>
  <text x="1060" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#fff">Sign in</text>

  <g transform="translate(110,180)">
    <text x="0" y="110" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#111">Start with your</text>
    <text x="0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#111">grade.</text>
    <text x="0" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#2a2a2a">Lumina has courses for every grade from 1 to</text>
    <text x="0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#2a2a2a">12. Pick a grade to see what you can learn, or</text>
    <text x="0" y="340" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#2a2a2a">browse everything by subject.</text>
    <rect x="0" y="390" width="250" height="56" rx="12" fill="#1d4f92" stroke="#111" stroke-width="3"/>
    <text x="125" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff">Browse all courses</text>
  </g>

  <g transform="translate(730,160)">
    <g>
      <rect x="0" y="0" width="110" height="110" rx="16" fill="#f2d34e" stroke="#1a1a1a" stroke-width="4"/>
      <text x="55" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#111">1</text>
      <rect x="120" y="0" width="110" height="110" rx="16" fill="#f2d34e" stroke="#1a1a1a" stroke-width="4"/>
      <text x="175" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#111">2</text>
      <rect x="240" y="0" width="110" height="110" rx="16" fill="#f2d34e" stroke="#1a1a1a" stroke-width="4"/>
      <text x="295" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#111">3</text>
      <rect x="360" y="0" width="110" height="110" rx="16" fill="#f2d34e" stroke="#1a1a1a" stroke-width="4"/>
      <text x="415" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#111">4</text>
    </g>
    <g transform="translate(0,120)">
      <rect x="0" y="0" width="110" height="110" rx="16" fill="#f2d34e" stroke="#1a1a1a" stroke-width="4"/>
      <text x="55" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#111">5</text>
      <rect x="120" y="0" width="110" height="110" rx="16" fill="#0f655d" stroke="#1a1a1a" stroke-width="4"/>
      <text x="175" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff">6</text>
      <rect x="240" y="0" width="110" height="110" rx="16" fill="#0f655d" stroke="#1a1a1a" stroke-width="4"/>
      <text x="295" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff">7</text>
      <rect x="360" y="0" width="110" height="110" rx="16" fill="#0f655d" stroke="#1a1a1a" stroke-width="4"/>
      <text x="415" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff">8</text>
    </g>
    <g transform="translate(0,240)">
      <rect x="0" y="0" width="110" height="110" rx="16" fill="#1e5eb3" stroke="#1a1a1a" stroke-width="4"/>
      <text x="55" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff">9</text>
      <rect x="120" y="0" width="110" height="110" rx="16" fill="#1e5eb3" stroke="#1a1a1a" stroke-width="4"/>
      <text x="175" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff">10</text>
      <rect x="240" y="0" width="110" height="110" rx="16" fill="#1e5eb3" stroke="#1a1a1a" stroke-width="4"/>
      <text x="295" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff">11</text>
      <rect x="360" y="0" width="110" height="110" rx="16" fill="#1e5eb3" stroke="#1a1a1a" stroke-width="4"/>
      <text x="415" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff">12</text>
    </g>
  </g>

  <g transform="translate(850,520)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#f2d34e" stroke="#111" stroke-width="2"/>
    <text x="28" y="15" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1d1d1d">Elementary, Grades 1 to 5</text>
    <rect x="270" y="0" width="18" height="18" rx="4" fill="#0f655d" stroke="#111" stroke-width="2"/>
    <text x="298" y="15" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1d1d1d">Middle school, Grades 6 to 8</text>
    <rect x="560" y="0" width="18" height="18" rx="4" fill="#1e5eb3" stroke="#111" stroke-width="2"/>
    <text x="588" y="15" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1d1d1d">High school, Grades 9 to 12</text>
  </g>

  <rect x="0" y="635" width="1200" height="65" fill="#f1efe7" stroke="#2d2d2d" stroke-width="2"/>
  <text x="54" y="674" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1d1d1d">Courses for Grades 1 to 12, organised by grade and subject.</text>
  <text x="1060" y="674" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1d1d1d">© 2026 Lumina</text>
</svg>
