<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Lumina UI components mockup</title>
  <desc id="desc">A showcase of UI patterns used in the Lumina design system</desc>
  <rect width="1200" height="900" fill="#f5f2ee"/>

  <g transform="translate(80,40)">
    <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#111">CHOICES</text>

    <g transform="translate(0,70)">
      <rect x="0" y="0" width="26" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>
      <path d="M6 13 L11 18 L21 6" stroke="#162b7d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="19" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">Email me when work is due</text>
      <text x="44" y="46" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b6b6b">At most once a day.</text>
    </g>

    <g transform="translate(0,120)">
      <rect x="0" y="0" width="26" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>
      <text x="44" y="19" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">Share my progress with my parent</text>
    </g>

    <g transform="translate(0,170)">
      <rect x="0" y="0" width="26" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>
      <text x="44" y="19" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">I agree to the class rules</text>
    </g>

    <g transform="translate(0,220)">
      <rect x="0" y="0" width="26" height="26" rx="6" fill="#fff" stroke="#d8254a" stroke-width="3"/>
      <circle cx="13" cy="13" r="4" fill="#d8254a"/>
      <text x="44" y="19" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#d8254a">I tick the box to agree to the class rules.</text>
    </g>

    <g transform="translate(495,70)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111">How did the lesson feel?</text>
      <text x="0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c5c5c">There is no wrong answer.</text>
      <g transform="translate(0,56)">
        <circle cx="18" cy="18" r="15" fill="#1d4f92" stroke="#111" stroke-width="3"/>
        <circle cx="18" cy="18" r="6" fill="#fff"/>
        <text x="46" y="25" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111">Easy</text>
      </g>
      <g transform="translate(0,110)">
        <circle cx="18" cy="18" r="15" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="46" y="25" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111">Just right</text>
      </g>
      <g transform="translate(0,165)">
        <circle cx="18" cy="18" r="15" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="46" y="25" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111">Hard</text>
      </g>
      <text x="46" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c5c5c">Your teacher will suggest extra practice.</text>
    </g>

    <g transform="translate(900,70)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111">Show answers after each question</text>
      <g transform="translate(0,40)">
        <rect x="0" y="0" width="52" height="28" rx="14" fill="#1d4f92"/>
        <circle cx="38" cy="14" r="11" fill="#fff"/>
      </g>
      <text x="0" y="102" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111">Sound effects</text>
      <text x="0" y="134" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c5c5c">Off by default.</text>
      <g transform="translate(0,160)">
        <rect x="0" y="0" width="52" height="28" rx="14" fill="#fff" stroke="#111" stroke-width="3"/>
        <circle cx="14" cy="14" r="11" fill="#fff" stroke="#111" stroke-width="3"/>
      </g>
      <text x="0" y="236" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111">Locked setting</text>
      <g transform="translate(0,260)">
        <rect x="0" y="0" width="52" height="28" rx="14" fill="#1d4f92"/>
        <circle cx="38" cy="14" r="11" fill="#fff"/>
      </g>
    </g>

    <g transform="translate(80,410)">
      <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#111">BADGE</text>
      <g transform="translate(0,70)">
        <rect x="0" y="0" width="102" height="46" rx="20" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="51" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Draft</text>
        <rect x="120" y="0" width="90" height="46" rx="20" fill="#dfeaff" stroke="#111" stroke-width="3"/>
        <text x="165" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">New</text>
        <rect x="230" y="0" width="120" height="46" rx="20" fill="#dff7d9" stroke="#111" stroke-width="3"/>
        <text x="290" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Completed</text>
        <rect x="380" y="0" width="120" height="46" rx="20" fill="#fff2c8" stroke="#111" stroke-width="3"/>
        <text x="440" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Due tomorrow</text>
        <rect x="530" y="0" width="112" height="46" rx="20" fill="#ffd7d7" stroke="#111" stroke-width="3"/>
        <text x="586" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Overdue</text>
        <rect x="670" y="0" width="148" height="46" rx="20" fill="#f7ec8b" stroke="#111" stroke-width="3"/>
        <text x="744" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Top score</text>
        <rect x="840" y="0" width="120" height="46" rx="20" fill="#d8eec7" stroke="#111" stroke-width="3"/>
        <text x="900" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Grades 1–5</text>
        <rect x="980" y="0" width="120" height="46" rx="20" fill="#d7d9ee" stroke="#111" stroke-width="3"/>
        <text x="1040" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Grades 6–8</text>
      </g>
    </g>

    <g transform="translate(80,560)">
      <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#111">CARD AND AVATAR</text>

      <g transform="translate(0,80)">
        <rect x="0" y="0" width="420" height="230" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
        <rect x="18" y="18" width="120" height="28" rx="14" fill="#e6f8ea" stroke="#111" stroke-width="2"/>
        <text x="78" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0d5b2b">In progress</text>
        <text x="18" y="92" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#111">Fractions and decimals</text>
        <text x="18" y="126" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4c4c4c">Grade 4 • Mathematics</text>
        <text x="18" y="170" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4c4c4c">Course progress</text>
        <rect x="18" y="184" width="260" height="18" rx="9" fill="#dfe5eb" stroke="#111" stroke-width="2"/>
        <rect x="18" y="184" width="170" height="18" rx="9" fill="#1d4f92"/>
        <text x="220" y="198" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111">62%</text>
        <rect x="18" y="212" width="180" height="46" rx="12" fill="#1d4f92" stroke="#111" stroke-width="3"/>
        <text x="108" y="243" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff">Continue</text>
      </g>

      <g transform="translate(520,80)">
        <rect x="0" y="0" width="514" height="230" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="36" y="52" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#111">Your class</text>
        <text x="36" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4c4c4c">Flat cards sit inside other surfaces.</text>

        <g transform="translate(100,120)">
          <circle cx="0" cy="0" r="28" fill="#f2d34e" stroke="#111" stroke-width="3"/>
          <text x="0" y="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#111">AL</text>
          <circle cx="70" cy="0" r="28" fill="#f2d34e" stroke="#111" stroke-width="3"/>
          <text x="70" y="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#111">GH</text>
          <circle cx="140" cy="0" r="28" fill="#f2d34e" stroke="#111" stroke-width="3"/>
          <text x="140" y="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#111">AT</text>
          <circle cx="210" cy="0" r="28" fill="#f2d34e" stroke="#111" stroke-width="3"/>
          <text x="210" y="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#111">KJ</text>
        </g>

        <g transform="translate(120,190)">
          <circle cx="0" cy="0" r="28" fill="#f2d34e" stroke="#111" stroke-width="3"/>
          <text x="0" y="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#111">M</text>
          <circle cx="118" cy="0" r="28" fill="#f2d34e" stroke="#111" stroke-width="3"/>
          <text x="118" y="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#111">MA</text>
        </g>
      </g>
    </g>

    <g transform="translate(80,820)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#111">TABS</text>
      <rect x="0" y="30" width="620" height="72" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
      <rect x="18" y="42" width="120" height="48" rx="12" fill="#fff" stroke="#111" stroke-width="3"/>
      <text x="78" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111">Lessons</text>
      <text x="170" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4c4c4c">Quizzes</text>
      <text x="290" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4c4c4c">My notes</text>
      <text x="0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4c4c4c">Twelve short lessons, about ten minutes each.</text>
    </g>

    <g transform="translate(80,940)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#111">DIALOG, SHEET, MENU, TOAST</text>
      <g transform="translate(0,36)">
        <rect x="0" y="0" width="170" height="58" rx="12" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="85" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Open dialog</text>
        <rect x="190" y="0" width="170" height="58" rx="12" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="275" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Open sheet</text>
        <rect x="380" y="0" width="170" height="58" rx="12" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="465" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Options</text>
        <rect x="570" y="0" width="170" height="58" rx="12" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="655" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Success toast</text>
        <rect x="760" y="0" width="170" height="58" rx="12" fill="#fff" stroke="#111" stroke-width="3"/>
        <text x="845" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Error toast</text>
      </g>
    </g>
  </g>
</svg>
